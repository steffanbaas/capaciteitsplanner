:root{color-scheme:light;
--page:#f9f9f7;--surface:#fcfcfb;--surface-2:#f3f2ee;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
--t-group:#6250d6;--t-gclient:#2a78d6;--t-client:#1baf7a;--t-project:#eb6834;
--good:#0ca30c;--good-ink:#006300;--warn:#fab219;--crit:#d03b3b;--accent:#2a78d6;
--s100:#cde2fb;--s200:#9ec5f4;--s300:#6da7ec;--s400:#3987e5;--s500:#256abf;--s600:#184f95;--s700:#0d366b;--mid:#f0efec}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
--page:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
--t-group:#9085e9;--t-gclient:#3987e5;--t-client:#199e70;--t-project:#d95926;--good-ink:#0ca30c;--accent:#3987e5;--mid:#383835}}
:root[data-theme="dark"]{color-scheme:dark;
--page:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
--t-group:#9085e9;--t-gclient:#3987e5;--t-client:#199e70;--t-project:#d95926;--good-ink:#0ca30c;--mid:#383835}
*{box-sizing:border-box}
body{margin:0;background-color:var(--page);background-attachment:fixed;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--ring)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px 0;max-width:1400px;margin:0 auto}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
input[type=date],input[type=month],input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 8px;min-height:32px}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.btn{border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:32px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 9px;min-height:26px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.savestate{font-size:12.5px;color:var(--muted)}
.savestate.dirty{color:var(--ink-2)}
nav{display:flex;gap:2px;padding:8px 20px 0;max-width:1400px;margin:0 auto;overflow-x:auto}
nav a{padding:8px 12px;border-radius:8px 8px 0 0;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:620}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}

(function(){LANG_PAIRS.forEach(function(p){if(!(p[0] in LANG_MAP))LANG_MAP[p[0]]=p[1];});

function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('capaciteitsplanner',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=function(){res(t.result);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};});}).catch(function(){return false;});}
function openHandle(h){return h.getFile().then(function(f){return f.arrayBuffer().then(function(b){return loadBuffer(b,f.name,h);});}).catch(function(e){UI.msg=(e&&e.name==='NotFoundError')?'Het laatst geopende bestand is niet meer gevonden (verplaatst of hernoemd?). Open het opnieuw.':'Kon het laatst geopende bestand niet openen: '+(e&&e.message||e);XL.last=null;render();});}
function openLast(){var h=XL.last;if(!h)return openFile();(h.requestPermission?h.requestPermission({mode:'readwrite'}):Promise.resolve('granted')).then(function(p){if(p==='granted')openHandle(h);else{UI.msg='Geen toestemming gekregen om het bestand te openen';render();}},function(){openHandle(h);});}
function autoOpenLast(){if(!window.showOpenFilePicker)return;idbGet('lastHandle').then(function(h){if(!h||XL.zip)return;XL.last=h;
  (h.queryPermission?h.queryPermission({mode:'readwrite'}):Promise.resolve('prompt')).then(function(p){if(p==='granted')openHandle(h);else render();},function(){render();});});}

function roomPct(){var v=+S.settings.roomPct;return v>0?v:80;}
function autoMin(){var v=S.settings.autoMin;return v===''||v==null||isNaN(+v)?10:+v;}
function autoMax(){var v=+S.settings.autoMax;return v>0?v:30;}

function contact(id){return byId(S.contacts,id);} function isArch(c){return!!(c&&String(c.arch||'').trim());} function cgroup(id){return byId(S.contactGroups,id);}
function respObj(id){if(!id)return null;var p=person(id);if(p)return p;var c=contact(id);if(isArch(c))return null;if(!c)return null;var g=cgroup(c.groupId);return{id:c.id,name:c.name,team:g?g.name:'Overige personen',ext:true,fn:c.fn||''};}
function respOptions(role,none){var o=[['',none||'— niemand —']].concat((role==='pm'?[]:sortN(S.people)).map(function(p){return[p.id,p.name+(p.team?' · '+p.team:'')];}));
  sortN(S.contactGroups).forEach(function(g){if((';'+(g.roles||'')+';').indexOf(';'+role+';')<0)return;S.contacts.filter(function(c){return c.groupId===g.id&&!isArch(c);}).sort(function(a,b){return a.name.localeCompare(b.name,'nl');}).forEach(function(c){o.push([c.id,c.name+' · '+g.name+' (overig)']);});});return o;}
function respHtml(id,cls){var r=respObj(id);if(!r)return'';return r.ext?'<span'+(cls?' class="'+cls+'"':'')+' data-tip="'+esc(r.team+(r.fn?' · '+r.fn:''))+'">'+esc(r.name)+' <span class="muted small">('+esc(r.team)+')</span></span>':'<a href="#medewerker" data-act="openp" data-id="'+r.id+'" style="color:inherit;text-decoration:none">'+esc(r.name)+'</a>';}
function ownerObj(x){if(!x)return null;return respObj(x.ownerId);}

var toastT=null;function toast(msg,kind){if(kind!=='err'&&typeof PREF!=='undefined'&&PREF.toasts==='0'&&/opgeslagen|saved/i.test(msg))return;var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t);}
  t.className=(kind==='err'?'err ':'')+'show';t.textContent=(kind==='err'?'⚠ ':'✓ ')+trS(msg);clearTimeout(toastT);toastT=setTimeout(function(){t.className=t.className.replace('show','');},kind==='err'?7000:2600);}
/* ---------- uren ---------- */
function HF(){return UI.hu==='mnd'?52/12:1;}
function HUW(){return UI.hu==='mnd'?'per maand':'per week';}
function fmtH(h){return fmtHr((+h||0)*HF())+(UI.hu==='mnd'?'/mnd':'/wk');}
function fmtHr(h){return(Math.round((+h||0)*10)/10).toLocaleString(UI.lang==='en'?'en-GB':'nl-NL',{maximumFractionDigits:1})+' u';}
function hrsA(pid,pct,d){return pctHrs(pid,pct)*(1-absOn(pid,d||UI.ref));}
function stdHrs(pid){var p=person(pid);return p?(+p.hours||0)*availOf(p)/100:0;}
function availHrs(pid,d){return stdHrs(pid)*(1-absOn(pid,d||UI.ref));}
function absTip(pid,d){var p=person(pid);if(!p)return'';d=d||UI.ref;var ss=schedSummary(p);return'Afwijkend van het rooster door afwezigheid\n'+absLabel(pid,d)+' ('+Math.round(absOn(pid,d)*100)+'%)\nStandaard: '+fmtH(p.hours)+(availOf(p)<100?', '+availOf(p)+'% inzetbaar = '+fmtH(stdHrs(pid)):'')+(ss?'\nRooster: '+ss:'')+'\nNu beschikbaar: '+fmtH(availHrs(pid,d));}
function absText(pid,d){d=d||UI.ref;return absLabel(pid,d)+' · beschikbaar '+fmtH(availHrs(pid,d))+' i.p.v. '+fmtH(stdHrs(pid));}
function absBadge(pid,d){d=d||UI.ref;if(!(absOn(pid,d)>0))return'';return'<span class="badge crit" data-tip="'+esc(absTip(pid,d))+'">✚ '+esc(absLabel(pid,d))+' · <b>'+fmtH(availHrs(pid,d))+'</b> <span style="font-weight:400;opacity:.8">i.p.v. '+fmtH(stdHrs(pid))+'</span></span>';}
function pctHrs(pid,pct){var p=person(pid);return p?(+pct||0)/100*(+p.hours||0):0;}
function fteH(x){if(!(x>0.004))return'<span class="muted">–</span>';return fmtF(x)+'<div class="muted small" style="font-weight:400;white-space:nowrap">'+fmtH(x*(+S.settings.fullTime||40))+'</div>';}
function fteHL(x){return fmtF(x)+' FTE · '+fmtH(x*(+S.settings.fullTime||40))+'';}

var APPVER='1.35';
var ABOUT={nl:"<h3>Wat is de Capaciteitsplanner?</h3> <p>De Capaciteitsplanner laat zien wie waar werkt, voor hoeveel uur en hoe lang. Je ziet per medewerker, klant, klantgroep, chapter en project hoeveel capaciteit er ingezet is, wie er ruimte heeft en wanneer er mensen beschikbaar komen. Zo kun je vooruit plannen, gesprekken met klanten voorbereiden en de bezetting presenteren aan anderen.</p> <p>De planner is één HTML-bestand dat je in de browser opent. Er is geen server en geen account nodig: alle gegevens staan in je eigen Excel-bestand.</p> <h3>Excel als database</h3> <ul> <li><b>Openen:</b> klik op <i>Openen</i> en kies het Excel-bestand (Capaciteitsplanner_database.xlsx). Bij een volgende keer opent de planner het laatst gebruikte bestand automatisch. Eventueel vraagt de browser eenmalig om toestemming.</li> <li><b>Automatisch opslaan:</b> in Chrome en Edge wordt elke wijziging na ongeveer een seconde automatisch in het Excel-bestand opgeslagen. Een melding bovenin bevestigt dat. Lukt opslaan niet, bijvoorbeeld omdat het bestand in Excel geopend is, dan zie je een foutmelding met de knop om het opnieuw te proberen.</li> <li><b>Andere browsers:</b> in browsers zonder schrijfrechten (zoals Firefox en Safari) werk je met <i>Excel downloaden</i> en vervang je zelf het oude bestand.</li> <li><b>Herladen:</b> heb je het bestand in Excel aangepast? Sluit het daar, en klik op <i>Herladen</i> om de wijzigingen in te lezen.</li> <li><b>Tabbladen:</b> Medewerkers, Chapters, Klantgroepen, Klanten, Projecten, Toewijzingen, Afwezigheid, Contactgroepen, Contactpersonen, Rollen en Instellingen. Nieuwe kolommen en tabbladen voegt de planner zelf toe als een nieuwe versie die nodig heeft; je bestaande gegevens blijven behouden.</li> <li><b>Formules in Excel:</b> de rekenkolommen in Excel geven een eenvoudige berekening. De planner zelf rekent nauwkeuriger: met werkschema's, afwezigheid, einddata van klanten, projecten on hold en automatische inzet.</li> </ul> <h3>Hoe de gegevens in elkaar zitten</h3> <ul> <li><b>Chapters</b> zijn de bovenste laag, bijvoorbeeld het Windows-chapter en het Azure-chapter. Elk chapter kan een verantwoordelijke hebben.</li> <li><b>Klantgroepen (pools)</b> vallen onder een chapter en bundelen klanten, zoals Pool 1, Pool 2 of Pool RUN. Wie op een pool werkt, werkt voor alle klanten in die pool.</li> <li><b>Klanten</b> horen bij een klantgroep of direct bij een chapter (losse klant). Een klant kan een steward, een verantwoordelijke, een einddatum, een contractstatus, een kans op verlenging, een contractvorm en een notitie hebben. Dezelfde klantnaam in meerdere chapters wordt in overzichten samengevoegd.</li> <li><b>Projecten</b> horen bij een klant of zijn intern. Een project heeft een start- en einddatum, een omschrijving, een project manager (te kiezen uit overige personen in een groep met die rol) en kan on hold gezet of afgerond worden.</li> <li><b>Medewerkers</b> hebben een team, een functie, een inzetbaarheid (percentage van de week dat inzetbaar is), een uren-per-week en eventueel een werkschema en uitdienstdatum.</li> <li><b>Overige personen</b> zijn mensen die geen medewerker in de planning zijn, zoals accountmanagers, directie of project managers. Je deelt ze in groepen in; per groep bepaal je voor welke rollen ze gekozen kunnen worden: verantwoordelijke chapter, klantgroep of klant, steward of project manager. Overige personen beheer je in <i>Gegevens beheren</i>. Haal daar het vinkje <i>Actief</i> weg om iemand te archiveren: die persoon verdwijnt dan uit alle overzichten en keuzelijsten, maar komt met alle koppelingen terug als je het vinkje weer aanzet.</li> </ul> <h3>Inzet plannen</h3> <ul> <li><b>Toewijzingen</b> koppelen een medewerker aan een chapter, klantgroep, klant of project, met een percentage en een start- en einddatum. Zonder einddatum loopt de inzet door.</li> <li><b>Normale inzet:</b> een vast percentage van de uren van de medewerker.</li> <li><b>Flexibele inzet:</b> het percentage verdeelt zich over wat er overblijft. Heeft iemand meerdere flexibele toewijzingen, dan wordt de vrije ruimte naar verhouding verdeeld.</li> <li><b>Flexibel max:</b> flexibele inzet met een maximum aantal uren per week. De inzet maakt plaats als er ander werk bijkomt, maar komt nooit boven het maximum uit. In de Flexruimte telt deze inzet als speelruimte.</li><li><b>Vaste inzet:</b> een met de klant afgesproken aantal uren per week. Dit gaat altijd voor.</li> <li><b>Automatische inzet:</b> laat je het percentage bij een project leeg, dan schat de planner de inzet tussen het minimum en maximum uit de rekenregels (standaard 10–30%), bij voorkeur uit vrije ruimte en anders ten koste van flexibele inzet.</li> <li><b>Werkschema's:</b> leg per medewerker vaste werkdagen en uren per dag vast, eventueel met afwisselende A- en B-weken.</li> <li><b>Afwezigheid:</b> ziekte, verlof of opleiding met een percentage, periode en korte opmerking. Afwezigheid verlaagt de beschikbare capaciteit én de ingezette uren in alle overzichten, ook bij gedeeltelijke afwezigheid. Overal waar zo iemand staat, zie je hoeveel uur hij dan wél beschikbaar is in plaats van de standaarduren volgens rooster.</li> <li><b>Einddata:</b> loopt een klantcontract af, een project af of gaat iemand uit dienst, dan stopt de inzet automatisch op die datum. Projecten die on hold staan tellen niet mee tot ze hervat worden.</li> </ul> <h3>De tabbladen</h3> <ul> <li><b>Presentatie:</b> een overzicht om te delen of te presenteren, per chapter of voor alles samen: kerncijfers, aflopende contracten, wie beschikbaar komt, projecten en inzet. Elk blok kun je kopiëren als tekst of afdrukken als PDF. De sub-tab <i>Top-down overzicht</i> toont de hele structuur van chapter via pools, klanten en projecten tot de medewerkers, met FTE, uren en mensen per niveau. Projecten zet je in dit overzicht aan of uit, in één keer of per project.</li> <li><b>Tijdlijn:</b> de inzet per maand, vooruit in de tijd, per medewerker, per klant of per project, in FTE of uren. De weergave <i>Flexruimte</i> toont de speelruimte voor inzetbaarheid: vrije capaciteit plus capaciteit op flexibele inzet, als grafiek, als totalen per maand en per medewerker. Klap pools in en uit en filter op chapter.</li> <li><b>Medewerkers:</b> alle medewerkers met hun bezetting op de peildatum. Filter op overbezet, ruimte of afwezig, en zoek op naam, team, klant, skill of certificering.</li> <li><b>Medewerker:</b> één medewerker in detail: toewijzingen, werkschema, afwezigheid, verantwoordelijkheden, skills, certificeringen, een notitie en een maandoverzicht. Hier kun je alles van die persoon direct aanpassen.</li> <li><b>Klant:</b> één klant in detail, net als de pagina Medewerker. Pas gegevens direct aan (klantgroep, steward, verantwoordelijke, contract, status, notitie), bewerk de toewijzingen op de klant en zijn projecten, voeg projecten en rollen toe en zie wie er via de pool betrokken is. Vanuit elke klantpopup ga je met <i>Klantpagina</i> naar deze pagina.</li><li><b>Chapters &amp; klanten:</b> <i>Per chapter</i> toont de structuur en inzet per chapter, of alle chapters naast elkaar. <i>Per klant</i> toont elke klant met alle betrokken mensen, ook via de pool. <i>Stewards</i> toont welke steward welke klanten heeft, of andersom, en welke klanten nog geen steward hebben.</li> <li><b>Projecten:</b> alle projecten, standaard gegroepeerd per klant (in- en uitklapbaar, met totale inzet per klant) of als platte lijst, met chapter, project manager, status en bezetting. Sorteer op elke kolom, koppel collega's, geef met een vinkje aan wie primair verantwoordelijk is (meerdere kan, getoond met ★), zet projecten on hold of rond ze af.</li> <li><b>Rollen:</b> verantwoordelijkheden die iemand vanuit zijn functie heeft zonder uren op een klant te maken, bijvoorbeeld welke architect over welke klanten gaat. Een rol kan gelden voor klanten, hele klantgroepen, hele chapters of projecten; je vinkt er in één keer meerdere aan. Bekijk de verdeling per persoon, als matrix per klant, of zie welke klanten nog niemand in een rol hebben. Stewards en verantwoordelijken van klanten verschijnen hier automatisch als rol Steward en Verantwoordelijke klant. Rollen tellen niet mee in de bezetting en zijn ook te zien in de klant- en projectpopup en bij de medewerker.</li><li><b>Skills &amp; certificeringen:</b> welke skills en certificeringen er in het team zijn en wie ze heeft, met aantallen. Wissel tussen een overzicht per skill of certificering en een overzicht per medewerker, en zoek op naam of skill. Invullen doe je op de pagina Medewerker. Het teamfilter bovenin geldt ook hier.</li><li><b>Sandbox:</b> speel met de inzet van mensen zonder iets op te slaan. Voeg inzet toe (ook voor een fictieve nieuwe collega), pas percentages of einddatums aan, haal inzet weg of laat iemand uit dienst gaan (je ziet dan ook welke rollen en verantwoordelijkheden vrijkomen), en zie direct het effect op bezetting, vrije capaciteit, flexruimte, overbezetting, per medewerker, per klant en voor de komende 12 maanden. Het startpunt is altijd de huidige situatie; het Excel-bestand blijft ongewijzigd.</li><li><b>Gegevens beheren:</b> alle tabellen om gegevens toe te voegen, te wijzigen en te verwijderen, inclusief overige personen en hun groepen.</li> <li><b>Instellingen (⚙):</b> weergave, werkwijze en rekenregels, en deze uitleg.</li> </ul> <h3>Handig om te weten</h3> <ul> <li><b>Peildatum:</b> bovenin kies je de datum waarop alle overzichten berekend worden. Met <i>Vandaag</i> ga je terug naar vandaag. Zo kun je vooruit kijken naar bijvoorbeeld de bezetting na een aflopend contract.</li> <li><b>Teamfilter:</b> beperk alle overzichten tot één team, bijvoorbeeld Windows of Azure.</li> <li><b>Klikken en aanwijzen:</b> klik op een gestippeld onderstreepte klantnaam of projectnaam voor een popup met alle details en betrokken mensen. Beweeg de muis over namen, balken en aantallen voor extra informatie.</li> <li><b>Telefoon:</b> op een smal scherm is de planner <b>alleen lezen</b>: je kunt alles bekijken maar niets wijzigen, en er wordt niets opgeslagen. Onderin staan de belangrijkste tabbladen (Overzicht, Mensen, Klanten, Tijdlijn) en onder <i>Meer</i> de rest. Peildatum, team, uren, taal en het bestand openen vind je onder ☰. Tik op een getal of balk voor extra informatie. Sandbox en Gegevens beheren zijn alleen op de computer beschikbaar.</li><li><b>Taal:</b> de planner is beschikbaar in het Nederlands en het Engels. Namen en notities worden niet vertaald.</li> <li><b>Uren en FTE:</b> percentages worden omgerekend naar uren per week op basis van de uren van de medewerker. Bovenin kies je of uren per week of per maand getoond worden (een maand is 52/12 weken). Invoervelden blijven in uren per week; FTE is gebaseerd op de fulltime week uit de rekenregels.</li> <li><b>Instellingen per browser:</b> weergave en werkwijze worden in je browser bewaard. De rekenregels staan in het Excel-bestand en gelden voor iedereen die het bestand gebruikt.</li> </ul> <h3>Beperkingen</h3> <ul> <li>Elk tabblad in Excel heeft ruimte voor ongeveer 200 regels.</li> <li>Werk niet tegelijk met meerdere mensen in hetzelfde bestand: de laatste die opslaat overschrijft de rest.</li> <li>Sluit het bestand in Excel voordat de planner erin opslaat.</li> </ul>",en:"<h3>What is the Capacity planner?</h3> <p>The Capacity planner shows who works where, for how many hours and for how long. For every employee, client, client group, chapter and project you see how much capacity is deployed, who has room and when people become available. This helps you plan ahead, prepare client conversations and present the occupancy to others.</p> <p>The planner is a single HTML file that you open in your browser. No server or account is needed: all data lives in your own Excel file.</p> <h3>Excel as the database</h3> <ul> <li><b>Opening:</b> click <i>Open</i> and choose the Excel file (Capaciteitsplanner_database.xlsx). Next time the planner opens the last used file automatically. The browser may ask for permission once.</li> <li><b>Autosave:</b> in Chrome and Edge every change is saved to the Excel file after about a second, confirmed by a notification at the top. If saving fails, for example because the file is open in Excel, you get an error with a button to retry.</li> <li><b>Other browsers:</b> in browsers without write access (such as Firefox and Safari) use <i>Download Excel</i> and replace the old file yourself.</li> <li><b>Reload:</b> changed the file in Excel? Close it there and click <i>Reload</i> to read the changes.</li> <li><b>Sheets:</b> Employees, Chapters, Client groups, Clients, Projects, Assignments, Absence, Contact groups, Contacts, Roles and Settings. New columns and sheets are added automatically when a new version needs them; your existing data is kept.</li> <li><b>Formulas in Excel:</b> the calculated columns in Excel give a simple calculation. The planner itself is more precise: it accounts for work schedules, absence, client end dates, projects on hold and automatic allocation.</li> </ul> <h3>How the data is structured</h3> <ul> <li><b>Chapters</b> are the top level, for example the Windows chapter and the Azure chapter. Each chapter can have a responsible person.</li> <li><b>Client groups (pools)</b> belong to a chapter and bundle clients, such as Pool 1, Pool 2 or Pool RUN. Anyone working on a pool works for all clients in that pool.</li> <li><b>Clients</b> belong to a client group or directly to a chapter (standalone client). A client can have a steward, a responsible person, an end date, a contract status, a likelihood of extension, a contract type and a note. The same client name in several chapters is merged in the overviews.</li> <li><b>Projects</b> belong to a client or are internal. A project has a start and end date, a description, a project manager (chosen from other people in a group with that role) and can be put on hold or completed.</li> <li><b>Employees</b> have a team, a position, an availability (share of the week that can be deployed), hours per week and optionally a work schedule and leaving date.</li> <li><b>Other people</b> are people who are not employees in the planning, such as account managers, management or project managers. You put them in groups; per group you decide which roles they can be chosen for: responsible for a chapter, client group or client, steward or project manager. Other people are managed in <i>Manage data</i>. Untick <i>Active</i> there to archive someone: the person disappears from all overviews and pick lists, and comes back with all links when you tick it again.</li> </ul> <h3>Planning deployment</h3> <ul> <li><b>Assignments</b> link an employee to a chapter, client group, client or project, with a percentage and a start and end date. Without an end date the assignment continues.</li> <li><b>Normal:</b> a fixed percentage of the employee's hours.</li> <li><b>Flexible:</b> the percentage is taken from whatever is left. With several flexible assignments the free room is shared proportionally.</li> <li><b>Flexible max:</b> flexible work with a maximum number of hours per week. It makes way when other work comes in, but never exceeds the maximum. In the Flex room view it counts as room.</li><li><b>Fixed:</b> a number of hours per week agreed with the client. This always comes first.</li> <li><b>Automatic:</b> leave the percentage of a project empty and the planner estimates it between the minimum and maximum from the calculation rules (10–30% by default), preferably from free room, otherwise at the expense of flexible work.</li> <li><b>Work schedules:</b> set fixed working days and hours per day per employee, optionally with alternating A and B weeks.</li> <li><b>Absence:</b> sickness, leave or training with a percentage, period and short note. Absence lowers available capacity and deployed hours in every overview, also when partially absent. Wherever such a person appears, you see how many hours they are available instead of their standard scheduled hours.</li> <li><b>End dates:</b> when a client contract ends, a project ends or someone leaves, deployment stops automatically on that date. Projects on hold don't count until they are resumed.</li> </ul> <h3>The tabs</h3> <ul> <li><b>Presentation:</b> an overview to share or present, per chapter or for everything together: key figures, expiring contracts, who becomes available, projects and deployment. Copy each block as text or print it as PDF. The <i>Top-down overview</i> sub-tab shows the whole structure from chapter via pools, clients and projects down to the employees, with FTE, hours and people per level. Switch projects on or off in this overview, all at once or per project.</li> <li><b>Timeline:</b> deployment per month, looking ahead, per employee, client or project, in FTE or hours. The <i>Flex room</i> view shows the room for deployability: free capacity plus capacity on flexible work, as a chart, as monthly totals and per employee. Expand or collapse pools and filter by chapter.</li> <li><b>Employees:</b> all employees with their occupancy on the reference date. Filter on overbooked, room or absent, and search by name, team, client, skill or certification.</li> <li><b>Employee:</b> one employee in detail: assignments, work schedule, absence, responsibilities, skills, certifications, a note and a monthly overview. Edit everything for that person right there.</li> <li><b>Client:</b> one client in detail, like the Employee page. Edit details directly (client group, steward, responsible person, contract, status, note), edit assignments on the client and its projects, add projects and roles, and see who is involved via the pool. From any client popup, <i>Client page</i> takes you here.</li><li><b>Chapters &amp; clients:</b> <i>Per chapter</i> shows structure and deployment per chapter, or all chapters side by side. <i>Per client</i> shows each client with everyone involved, including via the pool. <i>Stewards</i> shows which steward has which clients, or the other way round, and which clients don't have a steward yet.</li> <li><b>Projects:</b> all projects, grouped per client by default (collapsible, with total deployment per client) or as a flat list, with chapter, project manager, status and occupancy. Sort on any column, link colleagues, tick who is primarily responsible (several allowed, shown with ★), put projects on hold or complete them.</li> <li><b>Roles:</b> responsibilities someone has from their position without spending hours on a client, for example which architect covers which clients. A role can apply to clients, whole client groups, whole chapters or projects; you can tick several at once. View the division per person, as a matrix per client, or see which clients don't have anyone in a role yet. Client stewards and responsible persons appear here automatically as the Steward and Responsible for client roles. Roles don't count towards occupancy and are also shown in the client and project popups and on the employee page.</li><li><b>Skills &amp; certifications:</b> which skills and certifications exist in the team and who has them, with counts. Switch between an overview per skill or certification and an overview per employee, and search by name or skill. Fill them in on the Employee page. The team filter at the top applies here too.</li><li><b>Sandbox:</b> play with people's deployment without saving anything. Add deployment (also for a fictional new colleague), change percentages or end dates, remove deployment or let someone leave (you also see which roles and responsibilities become vacant), and immediately see the effect on occupancy, free capacity, flex room, overbooking, per employee, per client and for the next 12 months. The starting point is always the current situation; the Excel file stays unchanged.</li><li><b>Manage data:</b> all tables to add, edit and delete data, including other people and their groups.</li> <li><b>Settings (⚙):</b> display, way of working and calculation rules, plus this explanation.</li> </ul> <h3>Good to know</h3> <ul> <li><b>Reference date:</b> at the top you choose the date all overviews are calculated for. <i>Today</i> takes you back. Use it to look ahead, for example at occupancy after a contract ends.</li> <li><b>Team filter:</b> limit all overviews to one team, for example Windows or Azure.</li> <li><b>Clicking and hovering:</b> click a client or project name with a dotted underline for a popup with all details and people involved. Hover over names, bars and counts for extra information.</li> <li><b>Phone:</b> on a narrow screen the planner is <b>read-only</b>: you can view everything but change nothing, and nothing is saved. The main tabs (Overview, People, Clients, Timeline) are at the bottom and the rest is under <i>More</i>. Reference date, team, hours, language and opening the file are under ☰. Tap a number or bar for extra information. Sandbox and Manage data are only available on a computer.</li><li><b>Language:</b> the planner is available in Dutch and English. Names and notes are not translated.</li> <li><b>Hours and FTE:</b> percentages are converted to hours per week based on the employee's hours. At the top you choose whether hours are shown per week or per month (a month is 52/12 weeks). Input fields stay in hours per week; FTE is based on the full-time week from the calculation rules.</li> <li><b>Settings per browser:</b> display and way of working are stored in your browser. Calculation rules are stored in the Excel file and apply to everyone using it.</li> </ul> <h3>Limitations</h3> <ul> <li>Each Excel sheet has room for about 200 rows.</li> <li>Don't work in the same file with several people at once: whoever saves last overwrites the rest.</li> <li>Close the file in Excel before the planner saves to it.</li> </ul>"};

function dutyOn(x,d){return(!x.start||x.start<=d)&&(!x.end||x.end>=d)&&!!respObj(x.personId);}

function dutyWho(id){var p=person(id);if(p)return'<a href="#medewerker" data-act="openp" data-id="'+p.id+'" style="color:inherit;text-decoration:none;font-weight:550">'+esc(p.name)+'</a>';var r=respObj(id);return r?'<span style="font-weight:550">'+esc(r.name)+'</span> <span class="muted small">(overig)</span>':'';}
function dutyTip(x){return[x.role+' — '+(respObj(x.personId)||{name:'?'}).name,dutyTarget(x),(x.start||x.end)?(x.start?fmtD(x.start):'…')+' – '+(x.end?fmtD(x.end):'onbepaald'):'',x.note||''].filter(Boolean).join('\n');}
function chOfCl(c){var g=group(c.groupId);return g?g.chapterId:c.chapterId;}
function clientDuties(c,d){var g=group(c.groupId),ch=chOfCl(c),o=[];allDuties().forEach(function(x){if(!dutyOn(x,d))return;
  if(x.type==='client'&&x.targetId===c.id)o.push({x:x,via:''});else if(x.type==='group'&&g&&x.targetId===g.id)o.push({x:x,via:g.name});else if(x.type==='chapter'&&ch&&x.targetId===ch)o.push({x:x,via:(chapter(ch)||{name:''}).name});});return o;}
function projDuties(pr,d){var o=allDuties().filter(function(x){return dutyOn(x,d)&&x.type==='project'&&x.targetId===pr.id;}).map(function(x){return{x:x,via:''};});var c=client(pr.clientId);if(c)o=o.concat(clientDuties(c,d).map(function(r){return{x:r.x,via:r.via||c.name};}));return o;}
function dutyChips(list){if(!list.length)return'<span class="muted small">—</span>';var by={};list.forEach(function(r){(by[r.x.role]=by[r.x.role]||[]).push(r);});

      h+='<h3 style="margin:18px 0 6px;font-size:15px">'+esc(r)+' <span class="badge">'+ppl.length+'</span></h3><table class="ktable"><thead><tr><th style="width:24%">Persoon</th><th>Verantwoordelijk voor</th><th class="num" style="width:90px">Klanten</th></tr></thead><tbody>'+
      ppl.map(function(pid){var xs=byR[r][pid].slice().sort(function(a,b){return dutyTarget(a).localeCompare(dutyTarget(b),'nl');});var n={};xs.forEach(function(x){if(x.type==='client')n[x.targetId]=1;else if(x.type==='group')S.clients.forEach(function(c){if(c.groupId===x.targetId)n[c.id]=1;});else if(x.type==='chapter')S.clients.forEach(function(c){if(chOfCl(c)===x.targetId)n[c.id]=1;});});
        var rp=respObj(pid);return'<tr><td>'+dutyWho(pid)+'<div class="muted small">'+esc(rp&&(rp.team||rp.fn)||'')+'</div></td><td><div class="chips">'+xs.map(function(x){return'<span class="chip" data-tip="'+esc(dutyTip(x))+'">'+dutyTLink(x)+' '+dutyEdit(x)+'</span>';}).join('')+'</div></td><td class="num">'+Object.keys(n).length+'</td></tr>';}).join('')+'</tbody></table>';});
  } else {

      var byC={};none.forEach(function(o){var k=chOfClient(o.c)||'Zonder chapter';(byC[k]=byC[k]||[]).push(o.c);});

    } else {
      h+='<table class="ktable"><thead><tr><th style="width:22%">Klant</th>'+cols.map(function(r){return'<th>'+esc(r)+'</th>';}).join('')+'</tr></thead><tbody>';var last=null;

function tagList(v){var seen={};return String(v||'').split(/[;,\n]/).map(function(t){return t.trim();}).filter(function(t){var k=t.toLowerCase();if(!t||seen[k])return false;seen[k]=1;return true;});}
function allTags(k){var m={};S.people.forEach(function(p){tagList(p[k]).forEach(function(t){m[t]=1;});});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'nl');});}
function tagBox(p,k,ph){return'<div class="chips" style="margin-bottom:8px">'+(tagList(p[k]).map(function(t){return'<span class="chip notr">'+esc(t)+' <button class="btn sm ghost" data-act="tagdel" data-k="'+k+'" data-v="'+esc(t)+'" title="Verwijderen" style="padding:0 4px;min-height:0;height:18px;line-height:1">×</button></span>';}).join('')||'<span class="muted small">Nog niets ingevuld</span>')+'</div><input type="text" data-tag="'+k+'" list="dl_'+k+'" placeholder="'+ph+'" style="width:100%"><datalist id="dl_'+k+'">'+allTags(k).filter(function(t){return tagList(p[k]).indexOf(t)<0;}).map(function(t){return'<option value="'+esc(t)+'">';}).join('')+'</datalist>';}

function sumH(a){return a?a.reduce(function(s,x){return s+x;},0):0;}
function isoWeek(iso){var d=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)));var day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);var y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y0)/864e5+1)/7);}

    [['','Alle',base.length],['over','Overbezet',cnt.over||0],['ruimte','Ruimte',cnt.ruimte||0],['afw','Afwezig',cnt.afw||0],['goed','Goed',cnt.goed||0]].map(function(o){return'<button data-act="sf" data-v="'+o[0]+'" class="'+(sf===o[0]?'on':'')+'">'+o[1]+' <span style="opacity:.7">'+o[2]+'</span></button>';}).join('')+
